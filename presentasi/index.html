<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Silo Aeration System - Interactive Presentation Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      user-select: none;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #090d16;
      overflow: hidden;
    }
    #slide-viewport {
      width: 1280px;
      height: 720px;
      transform-origin: center center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border-radius: 4px;
      overflow: hidden;
      background: #f8fafc;
      position: absolute;
    }
    #slide-frame {
      width: 1280px;
      height: 720px;
      border: none;
      display: block;
    }
    /* Controls Bar */
    #control-bar {
      height: 60px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 50;
    }
    .left-controls, .center-controls, .right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #334155;
      border-color: #475569;
    }
    .btn-primary {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
      border-color: #0369a1;
    }
    .slide-indicator {
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      font-family: monospace;
      padding: 0 10px;
    }
    .slide-indicator span {
      color: #38bdf8;
      font-size: 16px;
    }
    select.slide-select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      max-width: 320px;
    }
    /* Notes Drawer */
    #notes-drawer {
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-top: 2px solid #0284c7;
      padding: 20px 32px;
      max-height: 200px;
      overflow-y: auto;
      transform: translateY(105%);
      transition: transform 0.25s ease;
      z-index: 40;
    }
    #notes-drawer.open {
      transform: translateY(0);
    }
    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .notes-tag {
      font-size: 11px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .notes-body {
      font-size: 14.5px;
      line-height: 1.6;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="stage">
      <div id="slide-viewport">
        <iframe id="slide-frame" src="slides/slide_01_judul.html"></iframe>
      </div>

      <!-- Notes Drawer -->
      <div id="notes-drawer">
        <div class="notes-header">
          <span class="notes-tag">SPEAKER NOTES · NASKAH BICARA</span>
          <button class="btn" style="padding:4px 10px; font-size:11px;" onclick="toggleNotes()">✕ Tutup</button>
        </div>
        <p class="notes-body" id="notes-text"></p>
      </div>
    </div>

    <!-- Controls Bar -->
    <div id="control-bar">
      <div class="left-controls">
        <button class="btn" id="btn-prev" onclick="prevSlide()">◀ Sebelumnya</button>
        <button class="btn btn-primary" id="btn-next" onclick="nextSlide()">Berikutnya ▶</button>
        <div class="slide-indicator"><span id="curr-num">01</span> / 12</div>
      </div>

      <div class="center-controls">
        <select class="slide-select" id="slide-picker" onchange="goToSlide(parseInt(this.value))">
          <option value="1">01. Judul &amp; Arsitektur Utama</option>
          <option value="2">02. Urgensi Kualitas &amp; Latar Belakang Silo</option>
          <option value="3">03. Kelemahan Sistem Relay Konvensional</option>
          <option value="4">04. Pemisahan Domain IoT vs Sistem Kendali</option>
          <option value="5">05. Diagram Blok Loop Tertutup Kanonikal</option>
          <option value="6">06. Visual Komponen Hardware &amp; Wiring</option>
          <option value="7">07. Pemodelan Matematis FOPDT Orde-1</option>
          <option value="8">08. Identifikasi Sistem dari Data Riil (PRC)</option>
          <option value="9">09. Penalaan PID Ziegler-Nichols (Z-N)</option>
          <option value="10">10. Evaluasi Respons Transien &amp; Uji Gangguan</option>
          <option value="11">11. Dashboard IoT MQTT &amp; Remote Tuning</option>
          <option value="12">12. Kesimpulan &amp; Roadmap Eksekusi 7 Hari</option>
        </select>
      </div>

      <div class="right-controls">
        <button class="btn" id="btn-notes" onclick="toggleNotes()">📝 Speaker Notes</button>
        <a href="export_pdf_semua_slide.html" target="_blank" class="btn" style="text-decoration:none;">📄 Cetak ke PDF</a>
        <button class="btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    const slides = [
      {
        file: "slides/slide_01_judul.html",
        title: "01. Judul & Arsitektur Utama",
        notes: "Selamat pagi/siang rekan-rekan. Pada kesempatan kali ini, kami mempresentasikan proyek terpadu antara IoT dan Sistem Kendali. Fokus utama proyek kami adalah merancang sistem kendali lingkar tertutup (closed-loop) berbasis PID untuk mengatur aerasi headspace silo bahan baku secara kontinu, presisi, dan terintegrasi dengan pemantauan real-time via IoT."
      },
      {
        file: "slides/slide_02_problem_statement.html",
        title: "02. Urgensi Kualitas & Latar Belakang Silo",
        notes: "Di industri pengolahan pangan dan pakan ternak, bahan baku disimpan di dalam silo vertikal dalam jumlah berton-ton. Masalah terbesarnya adalah bahan ini bersifat higroskopis. Jika kelembapan tinggi, terjadi fermentasi yang melepaskan gas berbahaya di atap silo. Gas dan uap air ini memicu kondensasi tetesan air di atap yang merusak bahan baku. Jika titik simpan awal ini rusak, seluruh rantai pasok produksi setelahnya akan terganggu."
      },
      {
        file: "slides/slide_03_gap_analysis.html",
        title: "03. Kelemahan Sistem Relay Konvensional",
        notes: "Banyak sistem pemantau gudang hanya memakai relay on-off: gas naik, kipas langsung menyala 100%. Di silo industri, ini berbahaya. Kipas yang mendadak berputar kencang meniup serbuk tepung menjadi suspensi debu di udara yang rawan memicu ledakan debu (dust explosion). Selain itu, relay on-off mengalami flapping dan tidak bisa menghilangkan steady-state error. Itulah alasan mutlak mengapa kita membutuhkan kendali proporsional kontinu berbasis PID."
      },
      {
        file: "slides/slide_04_pemisahan_domain.html",
        title: "04. Pemisahan Domain IoT vs Sistem Kendali",
        notes: "Agar ruang lingkup proyek ini jelas di mata penguji: Kami membagi sistem menjadi dua tingkatan hierarki. Tingkat 1 adalah Domain IoT yang berfungsi sebagai sistem supervisi data lingkungan, konektivitas MQTT, dan visualisasi dashboard. Tingkat 2 adalah Domain Sistem Kendali murni, yaitu loop tertutup yang mengolah sinyal error dan mengeksekusi algoritma PID untuk mengatur daya kipas dan katup bukaan ventilasi secara dinamis."
      },
      {
        file: "slides/slide_05_blok_diagram.html",
        title: "05. Diagram Blok Loop Tertutup Kanonikal",
        notes: "Sesuai dengan materi Kuliah Pertemuan 2, sistem kendali kami memiliki lima elemen wajib loop tertutup. Input acuan adalah ambang gas aman. Komparator menghitung nilai error. Kontroler PID menghitung sinyal kontrol u(t). Aktuator berupa Driver MOSFET dan Servo mengeksekusi aliran udara fisik. Plant adalah ruang silo bahan baku, dan sensor MQ135 bertindak sebagai jalur umpan balik yang menutup loop kendali ini."
      },
      {
        file: "slides/slide_06_komponen_hardware.html",
        title: "06. Visual Komponen Hardware & Wiring",
        notes: "Pada perancangan fisik, kami mengeliminasi relay mekanik dan menggantinya dengan Driver MOSFET solid-state pada GPIO 18. Ini memungkinkan ESP32 menyuplai sinyal PWM frekuensi tinggi untuk mengatur kecepatan hembusan kipas motor DC secara sangat halus. Sensor MQ135 diposisikan di GPIO 34 pada kanal ADC1 agar pembacaan analognya stabil dan tidak terganggu oleh transmisi radio WiFi."
      },
      {
        file: "slides/slide_07_pemodelan_matematis.html",
        title: "07. Pemodelan Matematis FOPDT Orde-1",
        notes: "Sesuai silabus Pertemuan 4 mengenai pemodelan sistem fisik, kami menurunkan persamaan diferensial kesetimbangan massa gas di dalam volume boks silo. Melalui Transformasi Laplace dengan kondisi mula nol, diperoleh fungsi alih orde-1 dengan waktu tunda. Model matematika inilah yang membuktikan bahwa proyek kami berbasis teori kendali linier LTI, bukan sekadar logika pemograman kondisional."
      },
      {
        file: "slides/slide_08_identifikasi_sistem.html",
        title: "08. Identifikasi Sistem dari Data Riil (PRC)",
        notes: "Kami menekankan bahwa parameter model fisik ini tidak dikarang. Kami menguji langsung boks miniatur silo kami dengan memberikan input undak PWM 200. Berdasarkan aturan respons transien 63.2% dari Kuliah Pertemuan 6, kami mengekstrak nilai gain statis K = 6.0, dead time L = 1.5 detik, dan time constant tau = 7.0 detik. Dari eksperimen nyata inilah fungsi alih boks silo kami terdefinisi secara ilmiah."
      },
      {
        file: "slides/slide_09_penalaan_pid.html",
        title: "09. Penalaan PID Ziegler-Nichols (Z-N)",
        notes: "Nilai Kp, Ki, dan Kd tidak dicari dengan menebak-nebak kode program, melainkan dihitung langsung dari parameter boks fisik menggunakan tabel kurva reaksi Ziegler-Nichols. Kami memperoleh Kp = 0.933, Ki = 0.311, dan Kd = 0.700. Komponen Integral menjadi kunci utama agar tidak terjadi steady-state error, sedangkan komponen Derivatif bertindak sebagai rem peredam agar aktuator tidak berayun liar."
      },
      {
        file: "slides/slide_10_evaluasi_kinerja.html",
        title: "10. Evaluasi Respons Transien & Uji Gangguan",
        notes: "Kinerja sistem kendali kami akan diuji secara kuantitatif mengacu pada materi Kuliah Pertemuan 6 dan 7. Kami akan mengukur rise time, settling time, memastikan tidak ada overshoot berlebih, dan membuktikan error keadaan tunak sama dengan nol. Kami juga menyertakan uji disturbance rejection untuk membuktikan ketangguhan PID saat menghadapi lonjakan gas tak terduga."
      },
      {
        file: "slides/slide_11_dashboard_iot.html",
        title: "11. Dashboard IoT MQTT & Remote Tuning",
        notes: "Keunggulan integrasi IoT kami adalah data respons transien kendali di-streaming secara real-time via MQTT ke web dashboard. Kami memasang live plotter di browser sehingga audiens dan penguji dapat melihat kurva step response Nise/Ogata tampil hidup di layar saat pengujian berlangsung. Kami juga menyediakan slider remote tuning untuk membuktikan perbedaan respon sistem secara langsung saat parameter Kp, Ki, atau Kd diubah."
      },
      {
        file: "slides/slide_12_kesimpulan_roadmap.html",
        title: "12. Kesimpulan & Roadmap Eksekusi 7 Hari",
        notes: "Sebagai penutup, proyek ini memberikan solusi komprehensif: menjaga kualitas bahan baku silo secara ilmiah menggunakan pemodelan sistem fisik, penalaan PID matematis, dan telemetri IoT. Seluruh tahapan pengerjaan telah kami petakan secara realistis mulai dari perakitan driver MOSFET hingga integrasi grafik web. Sekian presentasi dari kami, kami membuka ruang seluas-luasnya untuk sesi diskusi teknis dan tanya jawab. Terima kasih."
      }
    ];

    let currentIndex = 0;
    const viewport = document.getElementById("slide-viewport");
    const frame = document.getElementById("slide-frame");
    const currNum = document.getElementById("curr-num");
    const picker = document.getElementById("slide-picker");
    const notesDrawer = document.getElementById("notes-drawer");
    const notesText = document.getElementById("notes-text");

    function resizeViewport() {
      const stage = document.getElementById("stage");
      const sw = stage.clientWidth;
      const sh = stage.clientHeight;
      const scale = Math.min((sw - 40) / 1280, (sh - 40) / 720);
      viewport.style.transform = `scale(${Math.max(scale, 0.2)})`;
    }

    function renderSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentIndex = index;
      frame.src = slides[currentIndex].file;
      currNum.textContent = String(currentIndex + 1).padStart(2, "0");
      picker.value = String(currentIndex + 1);
      notesText.textContent = slides[currentIndex].notes;
    }

    function prevSlide() {
      if (currentIndex > 0) renderSlide(currentIndex - 1);
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) renderSlide(currentIndex + 1);
    }

    function goToSlide(slideNum) {
      renderSlide(slideNum - 1);
    }

    function toggleNotes() {
      notesDrawer.classList.toggle("open");
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener("resize", resizeViewport);
    window.addEventListener("load", () => {
      resizeViewport();
      renderSlide(0);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace") {
        e.preventDefault();
        prevSlide();
      } else if (e.key === "f" || e.key === "F") {
        toggleFullscreen();
      } else if (e.key === "n" || e.key === "N") {
        toggleNotes();
      } else if (e.key === "Home") {
        renderSlide(0);
      } else if (e.key === "End") {
        renderSlide(slides.length - 1);
      }
    });
  </script>
</body>
</html>
